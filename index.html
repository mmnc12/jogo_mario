<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo Mário</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="img/icone.png" type="image/x-icon">
</head>
<body>
    <div id="container">
        <header id="main-header">
            <div id="game-score">
                <img src="img/moeda.png" height="20px" alt="Ícone de uma moeda">
                Moedas:&nbsp;<span id="current-score">0</span>
            </div>
            <div id="game-name">
                Super Mário English Challenge
            </div>
        </header>
        <section id="main">
            <div id="left-side">
                <h3>FALE O NOME DA COR EM INGLÊS</h3>
                <span id="box-color"></span>

                <div id="current-color">

                </div>

                <button id="btn-respond">RESPONDER</button>
            </div>
            <div id="right-side">
                <img src="img/mario.png" alt="Imagem no Mário">
            </div>
        </section>

        <footer id="footer">
            <img src="img/logo-dio.png" height="90px" alt="logo da Dio">
        </footer>
    </div>
    <script src="js/functions.js"></script>
</body>
</html>
